# Built from the repository root: pnpm picks up pnpm-lock.yaml and the workspace
# packages there. `pnpm build:netlify` writes the function to
# `.netlify/functions-internal` and the static files to `dist`, both at the root
# (see NITRO_OUTPUT in app/vite.config.ts). With no `base`, Netlify also rebuilds
# on changes under `packages/`, the lockfile and the workspace files.
[build]
  command = "pnpm --filter @blossom/app build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"
  HUSKY = "0"
