name: blossom-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: blossom_dev
      POSTGRES_USER: blossom_dev
      POSTGRES_PASSWORD: blossom_dev
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - dev-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blossom_dev -d blossom_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  dev-pgdata:
