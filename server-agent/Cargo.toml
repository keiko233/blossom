[package]
name = "server-agent"
version = "1.7.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
getrandom = "0.4"
hex = "0.4"
http = "1"
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring"] }
processkit = "3.3.4"
progenitor-client = "0.17.0"
prost = "0.14"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
reqwest = { version = "0.13.4", features = ["form", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11"
x509-parser = "0.18"
tokio = { version = "1.52.3", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "process",
  "signal",
  "fs",
] }
tokio-stream = "0.1.18"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tar = "0.4.46"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
zeroize = "1.8"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
portable-pty = "0.9.0"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
openapiv3 = "2.2"
prettyplease = "0.3.0"
progenitor = "0.16.0"
serde_json = "1.0.150"
syn = "3.0.0"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
