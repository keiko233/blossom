name: "[Release] Build and Publish Server Agent Binaries"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Unified release tag (e.g. v1.4.0)
        required: true
        type: string

# This workflow builds static `server-agent` binaries and uploads them (plus
# `SHA256SUMS`) to the unified `v*` GitHub Release. Asset names deliberately
# carry no version so `.../releases/download/<tag>/server-agent-linux-amd64`
# stays stable.
#
# workflow_dispatch only builds and checks (assets stay as workflow artifacts);
# `v*` tag pushes and `workflow_call` upload the binaries to the `v*` release
# (creating it first if it does not already exist).

permissions:
  contents: read

concurrency:
  group: server-agent-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Gate on the checks the CI `server-agent` job runs, plus tag/version
  # agreement, before any release job spends runner time.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify tag matches manifest versions
        if: github.ref_type == 'tag' || github.event_name == 'workflow_call'
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          agent_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' server-agent/Cargo.toml | head -n1)"
          expected="v${agent_version}"
          if [ "${TAG_NAME}" != "${expected}" ]; then
            echo "tag ${TAG_NAME} does not match Cargo.toml version ${agent_version} (expected ${expected})" >&2
            exit 1
          fi
          root_version="$(jq -r .version package.json)"
          app_version="$(jq -r .version app/package.json)"
          if [ "${root_version}" != "${agent_version}" ] || [ "${app_version}" != "${agent_version}" ]; then
            echo "manifest version mismatch: package.json=${root_version}, app/package.json=${app_version}, Cargo.toml=${agent_version}" >&2
            exit 1
          fi

      - name: Verify Cargo.lock version matches Cargo.toml
        run: |
          manifest_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' server-agent/Cargo.toml | head -n1)"
          lock_version="$(awk '/^name = "server-agent"$/{found=1; next} found && /^version = /{print; exit}' server-agent/Cargo.lock | sed 's/^version = "\(.*\)"$/\1/')"
          if [ "${manifest_version}" != "${lock_version}" ]; then
            echo "Cargo.lock pins server-agent ${lock_version}, but Cargo.toml says ${manifest_version}" >&2
            exit 1
          fi

      # Same checks as the `server-agent` job in test.yml (minus the Docker
      # lifecycle test, which this workflow does not need).
      - name: Run tests
        working-directory: server-agent
        run: cargo test --locked

      - name: Check formatting
        working-directory: server-agent
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: server-agent
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: server-agent-linux-amd64
            runner: ubuntu-latest
          - asset: server-agent-linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Build inside `rust:alpine` (like stage 2 of server-agent/Dockerfile) so
      # the binary is a fully static musl build without cross-compilation. The
      # container is started with `docker run` rather than a job `container:`
      # so JavaScript actions (checkout, upload-artifact) keep running on the
      # glibc host. musl-dev/build-base for the C toolchain; openssl (static)
      # for reqwest's default-tls; pkgconf so openssl-sys can find it.
      - name: Build static binary
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/server-agent:/app" -w /app \
            -e AGENT_BUILD_ID="$(git rev-parse HEAD)" \
            -e OPENSSL_STATIC=1 -e OPENSSL_NO_VENDOR=1 -e PKG_CONFIG_ALL_STATIC=1 \
            rust:alpine sh -euc '
              apk add --no-cache musl-dev build-base openssl-dev openssl-libs-static pkgconf binutils
              cargo build --release --locked
              if readelf -d target/release/server-agent | grep -q NEEDED; then
                echo "binary is dynamically linked" >&2
                exit 1
              fi
              target/release/server-agent --version
            '
          sudo chown -R "$(id -u):$(id -g)" server-agent/target
          mv server-agent/target/release/server-agent "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: server-agent-*-*
          merge-multiple: true

      - name: Build SHA256SUMS
        working-directory: release-assets
        run: sha256sum server-agent-linux-* > SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --clobber
          else
            gh release create "${TAG_NAME}" \
              --verify-tag \
              --title "Blossom ${TAG_NAME}" \
              --generate-notes \
              release-assets/*
          fi
