name: "[Reusable] Build and Publish Server Agent Binaries"

on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string
      commit-sha:
        description: Commit SHA from the release event
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Gate on the checks the CI `server-agent` job runs, plus tag/version
  # agreement, before any release job spends runner time.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit-sha }}

      # Same checks as the `server-agent` job in test.yml (minus the Docker
      # lifecycle test, which this workflow does not need).
      - name: Run tests
        working-directory: server-agent
        run: cargo test --locked

      - name: Check formatting
        working-directory: server-agent
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: server-agent
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: server-agent-linux-amd64
            runner: ubuntu-latest
          - asset: server-agent-linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit-sha }}

      # Build inside `rust:alpine` (like stage 2 of server-agent/Dockerfile) so
      # the binary is a fully static musl build without cross-compilation. The
      # container is started with `docker run` rather than a job `container:`
      # so JavaScript actions (checkout, upload-artifact) keep running on the
      # glibc host. musl-dev/build-base for the C toolchain; openssl (static)
      # for reqwest's default-tls; pkgconf so openssl-sys can find it.
      - name: Build static binary
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/server-agent:/app" -w /app \
            -e AGENT_BUILD_ID="$(git rev-parse HEAD)" \
            -e OPENSSL_STATIC=1 -e OPENSSL_NO_VENDOR=1 -e PKG_CONFIG_ALL_STATIC=1 \
            rust:alpine sh -euc '
              apk add --no-cache musl-dev build-base openssl-dev openssl-libs-static pkgconf binutils
              cargo build --release --locked
              if readelf -d target/release/server-agent | grep -q NEEDED; then
                echo "binary is dynamically linked" >&2
                exit 1
              fi
              target/release/server-agent --version
            '
          sudo chown -R "$(id -u):$(id -g)" server-agent/target
          mv server-agent/target/release/server-agent "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit-sha }}

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: server-agent-*-*
          merge-multiple: true

      - name: Build SHA256SUMS
        working-directory: release-assets
        run: sha256sum server-agent-linux-amd64 server-agent-linux-arm64 > SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG_NAME" \
            release-assets/server-agent-linux-amd64 \
            release-assets/server-agent-linux-arm64 \
            release-assets/SHA256SUMS \
            --clobber
