name: "[Release] Build and Publish Server Agent Binaries"

on:
  push:
    tags: ["server-agent-v*"]
  workflow_dispatch:

# This workflow publishes static `server-agent` binaries (not Docker images)
# as GitHub Release assets for a bootstrap script to download. It is separate
# from docker.yml, which publishes the self-contained images to GHCR on `v*`
# tags; those share the `releases/latest` feed with every other tag in this
# repo (app images included), so releases created here MUST use
# `make_latest: false` and the agent must resolve its release via the tag
# prefix `server-agent-v` (GitHub API
# `GET /repos/{owner}/{repo}/releases`, filtered by `tag_name` prefix), not
# `releases/latest`. Asset names deliberately carry no version so that
# `.../releases/download/<tag>/server-agent-linux-amd64` stays stable.
#
# workflow_dispatch only builds and checks (assets stay as workflow artifacts);
# a release is created only for `server-agent-v*` tag pushes.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate on the checks the CI `server-agent` job runs, plus tag/version
  # agreement, before any release job spends runner time.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches server-agent/Cargo.toml version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' server-agent/Cargo.toml | head -n1)"
          expected="server-agent-v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version} (expected ${expected})" >&2
            exit 1
          fi

      - name: Verify Cargo.lock version matches Cargo.toml
        run: |
          manifest_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' server-agent/Cargo.toml | head -n1)"
          lock_version="$(awk '/^name = "server-agent"$/{found=1; next} found && /^version = /{print; exit}' server-agent/Cargo.lock | sed 's/^version = "\(.*\)"$/\1/')"
          if [ "${manifest_version}" != "${lock_version}" ]; then
            echo "Cargo.lock pins server-agent ${lock_version}, but Cargo.toml says ${manifest_version}" >&2
            exit 1
          fi

      # Same checks as the `server-agent` job in test.yml (minus the Docker
      # lifecycle test, which this workflow does not need).
      - name: Run tests
        working-directory: server-agent
        run: cargo test --locked

      - name: Check formatting
        working-directory: server-agent
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: server-agent
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: server-agent-linux-amd64
            runner: ubuntu-latest
          - asset: server-agent-linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Build inside `rust:alpine` (like stage 2 of server-agent/Dockerfile) so
      # the binary is a fully static musl build without cross-compilation. The
      # container is started with `docker run` rather than a job `container:`
      # so JavaScript actions (checkout, upload-artifact) keep running on the
      # glibc host. musl-dev/build-base for the C toolchain; openssl (static)
      # for reqwest's default-tls; pkgconf so openssl-sys can find it.
      - name: Build static binary
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/server-agent:/app" -w /app \
            -e AGENT_BUILD_ID="${GITHUB_SHA}" \
            -e OPENSSL_STATIC=1 -e OPENSSL_NO_VENDOR=1 -e PKG_CONFIG_ALL_STATIC=1 \
            rust:alpine sh -euc '
              apk add --no-cache musl-dev build-base openssl-dev openssl-libs-static pkgconf binutils
              cargo build --release --locked
              if readelf -d target/release/server-agent | grep -q NEEDED; then
                echo "binary is dynamically linked" >&2
                exit 1
              fi
              target/release/server-agent --version
            '
          sudo chown -R "$(id -u):$(id -g)" server-agent/target
          mv server-agent/target/release/server-agent "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: server-agent-*-*
          merge-multiple: true

      - name: Build SHA256SUMS
        working-directory: release-assets
        run: sha256sum server-agent-linux-* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "server-agent ${GITHUB_REF_NAME#server-agent-v}" \
            --notes "Static server-agent binaries. Verify checksums against SHA256SUMS." \
            --latest=false \
            release-assets/*
