name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build app (Cloudflare)
        run: pnpm build

      # Built one after another so outputs cannot collide.
      - name: Build app (Node)
        run: pnpm --filter @blossom/app build:node

      - name: Build app (Vercel)
        run: pnpm --filter @blossom/app build:vercel

      - name: Build app (Netlify)
        run: pnpm --filter @blossom/app build:netlify

  server-agent:
    name: Server agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-agent
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-agent -> target

      - name: Run tests
        run: cargo test --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build server agent image
        run: docker build --build-arg BUILD_ID=managed-tls-test -t blossom/server-agent:managed-tls-test .

      - name: Test managed TLS lifecycle
        run: scripts/test-managed-tls-docker.sh blossom/server-agent:managed-tls-test
