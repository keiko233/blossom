name: "[CI] Run App and Agent Tests"

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App tests and build
    runs-on: ubuntu-latest
    # Disposable database for the tests that need real PostgreSQL
    # (app/src/db/admin-bootstrap.test.ts). Throwaway credentials; the service
    # is discarded with the job.
    services:
      postgres:
        image: postgres:19-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: blossom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blossom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          BLOSSOM_BOOTSTRAP_TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/blossom_test

      - name: Verify Drizzle migrations
        working-directory: app
        run: |
          ./node_modules/.bin/drizzle-kit check --output json
          status="$(./node_modules/.bin/drizzle-kit generate --explain --output json | node -e 'const fs = require("node:fs"); const lines = fs.readFileSync(0, "utf8").trim().split(/\r?\n/); console.log(JSON.parse(lines.at(-1)).status);')"
          if [ "$status" != "no_changes" ]; then
            echo "Drizzle schema has un-generated changes (status=$status). Run pnpm --filter @blossom/app db:generate." >&2
            exit 1
          fi

      - name: Build app (Cloudflare)
        run: pnpm build

      # Built one after another so outputs cannot collide.
      - name: Build app (Node)
        run: pnpm --filter @blossom/app build:node

      - name: Build app (Vercel)
        run: pnpm --filter @blossom/app build:vercel

  server-agent:
    name: Server agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-agent
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-agent -> target

      - name: Run tests
        run: cargo test --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build thin server agent image
        run: docker build -t blossom/server-agent:runtime-test .

      - name: Build server agent test image
        run: docker build -f Dockerfile.test --build-arg BUILD_ID=managed-tls-test -t blossom/server-agent:managed-tls-test .

      - name: Test managed TLS lifecycle
        run: scripts/test-managed-tls-docker.sh blossom/server-agent:managed-tls-test
