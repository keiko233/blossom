name: "[Release] Prepare Version and Release"

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Version bump
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit-sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - id: plan
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          set -euo pipefail
          node scripts/src/release.ts \
            --bump "$VERSION_TYPE" \
            --dry-run > release-plan.json
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('release-plan.json', 'utf8')).version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Apply version
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          set -euo pipefail
          node scripts/src/release.ts --bump "$VERSION_TYPE"

      - name: Update changelog
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml \
            --unreleased --tag "v${VERSION}" \
            --prepend CHANGELOG.md

      - id: commit
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          files=(
            package.json
            app/package.json
            server-agent/Cargo.toml
            server-agent/Cargo.lock
            CHANGELOG.md
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "chore(release): prepare ${tag}"

          git tag -a "$tag" -m "Blossom ${tag}"
          git push origin HEAD:main
          git push origin "$tag"

          commit_sha="$(git rev-parse HEAD)"
          echo "sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --title "Blossom ${TAG}" \
            --generate-notes

  docker:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      commit-sha: ${{ needs.prepare.outputs.commit-sha }}
    secrets: inherit

  server-agent-release:
    needs: [prepare, release]
    permissions:
      contents: write
    uses: ./.github/workflows/server-agent-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
