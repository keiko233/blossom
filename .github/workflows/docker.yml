name: "[Release] Build and Publish Container Images"

on:
  release:
    types: [published]
  push:
    tags: ["v*", "server-agent-v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      app-tag:
        description: App release tag (e.g. v1.4.0)
        required: false
        type: string
        default: ""
      agent-tag:
        description: Server agent release tag (e.g. server-agent-v1.4.0)
        required: false
        type: string
        default: ""
      commit-sha:
        description: Commit SHA for the release
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.app-tag || inputs.agent-tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Decide which images need building: app tags (`v*`) build the control plane,
  # agent tags (`server-agent-v*`) build the server agent, and manual dispatches
  # build both.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      commit-sha: ${{ steps.targets.outputs.commit-sha }}
    steps:
      - id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
          INPUT_APP_TAG: ${{ inputs.app-tag }}
          INPUT_AGENT_TAG: ${{ inputs.agent-tag }}
          INPUT_COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          build_app=false
          build_agent=false
          app_tag=""
          agent_tag=""
          if [ "$EVENT_NAME" = "workflow_call" ]; then
            if [ -n "$INPUT_APP_TAG" ]; then
              build_app=true
              app_tag="$INPUT_APP_TAG"
            fi
            if [ -n "$INPUT_AGENT_TAG" ]; then
              build_agent=true
              agent_tag="$INPUT_AGENT_TAG"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            build_app=true
            build_agent=true
          elif [[ "$TAG_NAME" == server-agent-v* ]]; then
            build_agent=true
            agent_tag="$TAG_NAME"
          elif [[ "$TAG_NAME" == v* ]]; then
            build_app=true
            app_tag="$TAG_NAME"
          fi

          targets=$(jq -cn \
            --arg repo "ghcr.io/$GITHUB_REPOSITORY" \
            --arg app "$build_app" \
            --arg agent "$build_agent" \
            --arg app_tag "$app_tag" \
            --arg agent_tag "$agent_tag" '
            []
            + (if $app == "true" then [{
                name: "app",
                context: ".",
                image: $repo,
                tag: $app_tag,
                "cache-path": "pnpm-store",
                "cache-map": {"pnpm-store": "/pnpm/store"}
              }] else [] end)
            + (if $agent == "true" then [{
                name: "server-agent",
                context: "./server-agent",
                image: ($repo + "/server-agent"),
                tag: $agent_tag,
                "cache-path": "",
                "cache-map": {}
              }] else [] end)')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "commit-sha=${INPUT_COMMIT_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "building: $(jq -r 'map(.name) | join(", ") | if . == "" then "(nothing)" else . end' <<< "$targets")"

  # Build each image natively per architecture (no QEMU emulation) and push
  # by digest; the merge job below assembles the multi-arch manifest.
  build:
    needs: prepare
    if: needs.prepare.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target.tag || github.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Persist the Dockerfile RUN cache mounts (pnpm store, go mod/build,
      # cargo registry/target) across runs — ephemeral runners lose them.
      - name: Restore build cache mounts
        if: matrix.target['cache-path'] != ''
        id: cache-mounts
        uses: actions/cache@v6
        with:
          path: ${{ matrix.target['cache-path'] }}
          key: cache-mounts-${{ matrix.target.name }}-${{ matrix.platform.arch }}-${{ hashFiles('pnpm-lock.yaml', 'server-agent/Cargo.lock') }}
          restore-keys: |
            cache-mounts-${{ matrix.target.name }}-${{ matrix.platform.arch }}-

      - name: Inject cache mounts into buildkit
        if: matrix.target['cache-path'] != ''
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: ${{ toJSON(matrix.target['cache-map']) }}
          skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.target.context }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ matrix.target.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}-${{ matrix.platform.arch }}
          # Bake the OCI revision (commit sha) into the agent binary as its
          # build ID; harmless for the app image which ignores it.
          build-args: |
            BUILD_ID=${{ needs.prepare.outputs.commit-sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.target.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into one tagged multi-arch manifest per image.
  merge:
    needs: [prepare, build]
    if: needs.prepare.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.event_name != 'workflow_call'
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.target.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=match,pattern=^server-agent-v(.*)$
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - id: resolve-tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_NAME: ${{ matrix.target.name }}
          IMAGE: ${{ matrix.target.image }}
          TAG: ${{ matrix.target.tag }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit-sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_call" ]; then
            short_sha="${COMMIT_SHA:0:7}"
            if [ "$TARGET_NAME" = "app" ]; then
              version="${TAG#v}"
              minor="${version%.*}"
              tag_flags="-t ${IMAGE}:${version} -t ${IMAGE}:${minor} -t ${IMAGE}:latest -t ${IMAGE}:sha-${short_sha}"
              first_tag="${IMAGE}:${version}"
            else
              version="${TAG#server-agent-v}"
              tag_flags="-t ${IMAGE}:${version} -t ${IMAGE}:sha-${short_sha}"
              first_tag="${IMAGE}:${version}"
            fi
          else
            tag_flags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
            first_tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          fi
          echo "tag-flags=$tag_flags" >> "$GITHUB_OUTPUT"
          echo "first-tag=$first_tag" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            ${{ steps.resolve-tags.outputs.tag-flags }} \
            $(printf '${{ matrix.target.image }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.resolve-tags.outputs.first-tag }}"
